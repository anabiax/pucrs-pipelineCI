name: CI/CD

on:
  push:
    branches: [main, feature/fase2]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pucrs-pipelineci

jobs:
  build-test:
    name: Lint, testes e cobertura
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Testes automatizados com cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  terraform-validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: terraform init
        run: terraform init -backend=false
        working-directory: infra

      - name: terraform validate
        run: terraform validate
        working-directory: infra

  # ---------- Entrega Contínua (CD) ----------
  docker-build:
    name: Build e publicação da imagem Docker
    runs-on: ubuntu-latest
    needs: [build-test, terraform-validate]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy na EC2
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    environment: producao
    steps:
      - uses: actions/checkout@v4

      - name: Enviar arquivos de deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ec2-user
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,scripts/deploy.sh"
          target: /home/ec2-user/app

      - name: Executar deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ec2-user
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            IMAGE=${{ env.IMAGE }}:${{ github.sha }} bash scripts/deploy.sh
